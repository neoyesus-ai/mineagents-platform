services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mineagents
      POSTGRES_USER: mineagents
      POSTGRES_PASSWORD: change-me
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mineagents -d mineagents"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
  coordinator:
    build:
      context: .
      dockerfile: apps/coordinator/Dockerfile
    environment:
      COORDINATOR_HOST: 0.0.0.0
      COORDINATOR_PORT: 3000
      DATABASE_URL: postgresql://mineagents:change-me@postgres:5432/mineagents
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
